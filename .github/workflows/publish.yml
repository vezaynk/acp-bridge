name: publish

# Publishing a drafted release is the trigger. GitHub creates the tag as part of publishing,
# so this fires with the tag already in place for MinVer to read.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and validate without pushing or uploading'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Everything ships only if the bridge still works, so the gate runs once, first, rather than
  # being repeated in each downstream job.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build acp-bridge.slnx -c Release

      - name: Conformance
        run: dotnet run --project tests/AcpKit.Bridge.Tests -c Release --no-build
        env:
          ACP_BRIDGE: ${{ github.workspace }}/artifacts/bin/AcpKit.Bridge/release/acp-bridge

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One Linux runner builds every target: self-contained publishing is cross-platform,
        # because the runtime packs are ordinary NuGet packages. Native AOT would have needed
        # a runner per operating system for a binary this is fast enough without.
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/AcpKit.Bridge \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:DebugType=none \
            -o "publish/${{ matrix.rid }}"

      # Self-contained so the machine running an agent needs no .NET installed. Trimmed
      # because 18 MB is a download someone will accept and 98 MB is one they will not.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          version='${{ github.event.release.tag_name || github.sha }}'
          name="acp-bridge-${version}-${rid}"

          cp README.md LICENSE "publish/${rid}/"

          mkdir -p dist
          if [[ "$rid" == win-* ]]; then
            (cd "publish/${rid}" && zip -qr "../../dist/${name}.zip" .)
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            chmod +x "publish/${rid}/acp-bridge"
            tar -czf "dist/${name}.tar.gz" -C "publish/${rid}" .
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # So a download can be checked against something, rather than trusted because it
      # arrived over HTTPS.
      - name: Checksum
        run: |
          cd dist
          sha256sum "$(basename '${{ steps.package.outputs.asset }}')" \
            > "$(basename '${{ steps.package.outputs.asset }}').sha256"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/* --clobber

      - name: Keep as a build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: acp-bridge-${{ matrix.rid }}
          path: dist/*

  nuget:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/AcpKit.Bridge -c Release -o artifacts/package

      # Exchanges this run's OIDC token for a short-lived NuGet key. The trust is configured on
      # nuget.org against this repository and this workflow filename, so renaming the file
      # breaks publishing by design rather than publishing from somewhere unexpected.
      - name: Authenticate to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: knyzorg

      - name: Push
        if: github.event_name == 'release' || !inputs.dry-run
        run: |
          dotnet nuget push 'artifacts/package/*.nupkg' \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
